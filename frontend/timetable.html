<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Study Planner - NotebookLM Style</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f5f6fa;
      color: #2f3640;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #273c75;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 20px;
    }

    section {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    section h2 {
      margin-bottom: 15px;
      color: #192a56;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #dcdde1;
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background-color: #487eb0;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background-color: #40739e;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #dcdde1;
    }

    th {
      background-color: #40739e;
      color: white;
    }

    tbody tr:nth-child(even) {
      background-color: #f1f2f6;
    }

    .timetable-panel {
      max-height: 400px;
      overflow-y: auto;
    }
  </style>
</head>

<body>
  <h1>Study Planner</h1>

  <div class="container">

    <!-- Left Panel -->
    <section>
      <h2>Add Exam</h2>
      <label>Subject
        <input type="text" id="subject">
      </label>
      <label>Exam Date
        <input type="date" id="examDate">
      </label>
      <label>Total Chapters
        <input type="number" id="totalChapters">
      </label>
      <label>Hours per Day
        <input type="number" id="hoursPerDay">
      </label>
      <button>Save Exam</button>
    </section>

    <!-- Center Panel -->
    <section>
      <h2>Generated Timetable</h2>
      <div class="timetable-panel">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Start Chapter</th>
              <th>End Chapter</th>
              <th>Hours</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2025-01-10</td>
              <td>1</td>
              <td>3</td>
              <td>4</td>
              
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Right Panel -->
    <section>
      <h2>Tools</h2>
      <button>Summary</button>
      <button>Flashcards</button>
      <button>Export PDF</button>
    </section>

  </div>
</body>
</html>
