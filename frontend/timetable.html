<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Study Planner - Timetable</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Smart Study Planner</h1>
    <h2>Weekly Timetable</h2>
    <nav>
      <a href="timetable.html">Timetable</a>
      <a href="today.html">Today's Plan</a>
    </nav>
  </header>

  <main>
    <section id="timetable-section">
      <h3>Your timetable</h3>
      <table id="timetable-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Subject</th>
            <th>Start</th>
            <th>End</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody id="timetable-body">
          <!-- timetable.js will insert rows here -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="js/timetable.js"></script>
</body>
</html>
